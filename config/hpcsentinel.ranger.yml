# Configuration used to validate HPCSentinel on the SPU Ranger cluster (a test environment).
# It is an example of adapting the platform to one cluster: only the selector and the node-name
# mapping below differ from config/hpcsentinel.example.yml. Copy it to config/hpcsentinel.yml.
# 10.10.10.101:9100 -> node01 ... 10.10.10.148:9100 -> node48.
# HPCSentinel configuration (FR-05, NFR-10).
# Copy this file to config/hpcsentinel.yml and edit it for your cluster.
# Changing metrics, node names or detector settings needs no change to the code.
#
# Every query must contain $SELECTOR. It is replaced by cluster.selector, which limits
# the query to the nodes being monitored and keeps the platform from reading anything else.

prometheus:
  # Address of Prometheus. The PROMETHEUS_URL environment variable overrides this value.
  url: http://localhost:9090
  step_seconds: 15          # resolution requested from Prometheus
  timeout_seconds: 20

cluster:
  # Prometheus label matchers that select the compute nodes (without the braces).
  selector: 'job="ranger_compute_nodes"'
  # Label that identifies a node in the node-exporter series.
  node_label: instance
  # How the label value is turned into the node name shown in the platform.
  # Example for values such as "10.10.10.116:9100" -> "compute16":
  #   node_name_regex: '^10\.10\.10\.1(?P<n>\d\d):9100$'
  #   node_name_template: 'compute{n}'
  node_name_regex: '^10\.10\.10\.1(?P<n>\d\d):9100$'
  node_name_template: 'compute{n}'

detection:
  retrieval_interval_seconds: 120   # how often a detection cycle runs (default two minutes)
  persistence_windows: 3            # consecutive abnormal windows required for an alert (BR-01)
  alert_threshold: 3.0              # combined score above which a window is abnormal
  window_minutes: 15                # span of data used to prepare each window
  load_idle_cpu_busy: 0.10          # CPU busy ratio below which a node counts as idle
  feature_spans_minutes: [5, 15]    # rolling windows used as features; add 60 only with state_stability_minutes: 60
  state_stability_minutes: 15       # a node is scored only after its load state has been steady this long
  train_stride_minutes: 5           # spacing of the windows used for learning
  relearn_hours: 168                # re-learn baselines this often; 0 turns scheduled re-learning off (FR-17)
  relearn_days: 14                  # length of the rolling window of recent data used
  # weights: {baseline: 0.4, peer: 0.2, model: 0.4}   # optional, how the three scores are combined

# Metrics used by the detector. Each query returns one series per node.
# Metrics missing on a cluster are reported by the readiness check and skipped.
metrics:
  - name: cpu_busy
    group: cpu
    query: '1 - avg by (instance) (rate(node_cpu_seconds_total{$SELECTOR,mode="idle"}[2m]))'
  - name: load_per_core
    group: cpu
    query: 'node_load1{$SELECTOR} / on(instance) count by (instance) (node_cpu_seconds_total{$SELECTOR,mode="idle"})'
  - name: context_switch_rate
    group: cpu
    query: 'rate(node_context_switches_total{$SELECTOR}[2m])'
  - name: mem_available_ratio
    group: memory
    query: 'node_memory_MemAvailable_bytes{$SELECTOR} / node_memory_MemTotal_bytes{$SELECTOR}'
  - name: swap_used_bytes
    group: memory
    query: 'node_memory_SwapTotal_bytes{$SELECTOR} - node_memory_SwapFree_bytes{$SELECTOR}'
  - name: major_fault_rate
    group: memory
    query: 'rate(node_vmstat_pgmajfault{$SELECTOR}[2m])'
  - name: ecc_correctable_15m
    group: memory
    query: 'sum by (instance) (increase(node_edac_correctable_errors_total{$SELECTOR}[15m]))'
  - name: net_rx_bytes_rate
    group: network
    query: 'sum by (instance) (rate(node_network_receive_bytes_total{$SELECTOR,device!~"lo|veth.*|docker.*|virbr.*|br-.*"}[2m]))'
  - name: net_tx_bytes_rate
    group: network
    query: 'sum by (instance) (rate(node_network_transmit_bytes_total{$SELECTOR,device!~"lo|veth.*|docker.*|virbr.*|br-.*"}[2m]))'
  - name: net_error_rate
    group: network
    query: 'sum by (instance) (rate(node_network_receive_errs_total{$SELECTOR,device!~"lo|veth.*|docker.*|virbr.*|br-.*"}[2m])) + sum by (instance) (rate(node_network_transmit_errs_total{$SELECTOR,device!~"lo|veth.*|docker.*|virbr.*|br-.*"}[2m]))'
  - name: net_drop_rate
    group: network
    query: 'sum by (instance) (rate(node_network_receive_drop_total{$SELECTOR,device!~"lo|veth.*|docker.*|virbr.*|br-.*"}[2m])) + sum by (instance) (rate(node_network_transmit_drop_total{$SELECTOR,device!~"lo|veth.*|docker.*|virbr.*|br-.*"}[2m]))'
  - name: disk_busy_ratio
    group: storage
    query: 'sum by (instance) (rate(node_disk_io_time_seconds_total{$SELECTOR}[2m]))'
  - name: nfs_request_rate
    group: storage
    query: 'sum by (instance) (rate(node_nfs_requests_total{$SELECTOR}[2m]))'
  - name: processes_blocked
    group: system
    query: 'node_procs_blocked{$SELECTOR}'
  - name: open_file_descriptors
    group: system
    query: 'node_filefd_allocated{$SELECTOR}'
  - name: clock_offset_seconds
    group: system
    query: 'abs(node_timex_offset_seconds{$SELECTOR})'
