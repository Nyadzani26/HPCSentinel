<script>
window.Sentinel = (function () {
  function si(v, step, units) { var i = 0; while (Math.abs(v) >= step && i < units.length - 1) { v /= step; i++; } return (Math.abs(v) >= 100 || (i === 0 && v === Math.round(v)) ? v.toFixed(0) : v.toFixed(1)) + ' ' + units[i]; }
  function fmt(v, kind) {
    if (v === null || v === undefined || isNaN(v)) return '–';
    switch (kind) {
      case 'ratio': return (Math.abs(v) < 0.995 ? (v * 100).toFixed(1) : (v * 100).toFixed(0)) + '%';
      case 'bytes': return si(v, 1024, ['B', 'KB', 'MB', 'GB', 'TB']);
      case 'bytes_per_second': return si(v, 1024, ['B/s', 'KB/s', 'MB/s', 'GB/s']);
      case 'per_second': return (Math.abs(v) < 1000 ? Number(v.toPrecision(3)) : (v / 1000).toFixed(1) + 'k') + '/s';
      case 'seconds': return Math.abs(v) < 1 ? (v * 1000).toFixed(2) + ' ms' : v.toFixed(2) + ' s';
      case 'count': return Math.abs(v) >= 10 || v === Math.round(v) ? Math.round(v).toLocaleString() : v.toFixed(1);
      default: return Number(v.toPrecision(3)).toString();
    }
  }
  function clock(t) { var d = new Date(t); return d.toISOString().slice(11, 16); }
  function day(t) { return new Date(t).toISOString().slice(0, 10) + ' ' + clock(t) + ' UTC'; }
  var css = getComputedStyle(document.documentElement);
  function color(n, d) { return css.getPropertyValue(n).trim() || d; }

  function line(host, points, o) {
    o = o || {};
    var W = Math.max(240, Math.round(host.clientWidth || o.w || 640)), H = o.h || 150, L = 8, R = 8, T = 10, B = 20, kind = o.kind || 'number';
    var ts = points.map(function (p) { return new Date(p.t).getTime(); }), vs = points.map(function (p) { return p.v; });
    if (!points.length) { host.innerHTML = '<p class="muted small">No readings yet.</p>'; return; }
    var t0 = ts[0], t1 = ts[ts.length - 1] === t0 ? t0 + 1 : ts[ts.length - 1];
    var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    if (o.band) { lo = Math.min(lo, o.band[0]); hi = Math.max(hi, o.band[1]); }
    if (o.threshold !== undefined && o.threshold !== null) hi = Math.max(hi, o.threshold * 1.15);
    if (o.floor !== undefined) lo = Math.min(lo, o.floor);
    var dlo = Math.min.apply(null, vs), dhi = Math.max.apply(null, vs), flat = dhi === dlo;
    if (hi === lo) { hi = lo + 1; }
    var pad = (hi - lo) * 0.08; hi += pad; if (o.floor === undefined) lo -= pad;
    function x(t) { return L + (t - t0) / (t1 - t0) * (W - L - R); }
    function y(v) { return H - B - (v - lo) / (hi - lo) * (H - T - B); }
    var accent = color('--ink', '#0c1922'), bad = color('--bad', '#d4351f'), ok = color('--ok', '#0a8a66'), muted = color('--muted', '#566772'), line = color('--rule-2', '#c5cfd5');
    var s = '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (H - B) + '" y2="' + (H - B) + '" stroke="' + line + '"/>';
    if (o.band) {
      var b0 = Math.max(lo, o.band[0]), b1 = Math.min(hi, o.band[1]);
      s += '<rect x="' + L + '" y="' + y(b1).toFixed(1) + '" width="' + (W - L - R) + '" height="' + Math.max(1, y(b0) - y(b1)).toFixed(1) + '" fill="' + ok + '" opacity=".13"/>';
    }
    if (o.threshold !== undefined && o.threshold !== null) {
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(o.threshold).toFixed(1) + '" y2="' + y(o.threshold).toFixed(1) + '" stroke="' + bad + '" stroke-dasharray="5 4" opacity=".8"/>' +
           '<text x="' + (W - R) + '" y="' + (y(o.threshold) - 4).toFixed(1) + '" text-anchor="end" class="ct" font-size="11" font-family="Public Sans, system-ui, sans-serif" fill="' + bad + '">alert level</text>';
    }
    (o.markers || []).forEach(function (m) {
      var mt = new Date(m).getTime(); if (mt < t0 || mt > t1) return;
      s += '<line x1="' + x(mt).toFixed(1) + '" x2="' + x(mt).toFixed(1) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="' + bad + '" stroke-width="1.5"/>';
    });
    var path = points.map(function (p, i) { return x(ts[i]).toFixed(1) + ',' + y(p.v).toFixed(1); }).join(' ');
    s += '<polygon fill="' + accent + '" opacity=".07" points="' + x(ts[0]).toFixed(1) + ',' + (H - B) + ' ' + path + ' ' + x(ts[ts.length - 1]).toFixed(1) + ',' + (H - B) + '"/>';
    s += '<polyline fill="none" stroke="' + accent + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" points="' + path + '"/>';
    s += '<text x="' + (L + 2) + '" y="' + (T + 8) + '" class="ct" font-size="11" font-family="Public Sans, system-ui, sans-serif" fill="' + muted + '">' + fmt(dhi, kind) + '</text>';
    if (!flat) s += '<text x="' + (L + 2) + '" y="' + (H - B - 4) + '" class="ct" font-size="11" font-family="Public Sans, system-ui, sans-serif" fill="' + muted + '">' + fmt(o.floor !== undefined ? Math.min(dlo, o.floor) : dlo, kind) + '</text>';
    s += '<text x="' + L + '" y="' + (H - 5) + '" class="ct" font-size="11" font-family="Public Sans, system-ui, sans-serif" fill="' + muted + '">' + clock(t0) + '</text><text x="' + (W - R) + '" y="' + (H - 5) + '" text-anchor="end" class="ct" font-size="11" font-family="Public Sans, system-ui, sans-serif" fill="' + muted + '">' + clock(t1) + ' UTC</text>';
    s += '<line id="cx" y1="' + T + '" y2="' + (H - B) + '" stroke="' + muted + '" opacity="0"/><circle id="cd" r="3.5" fill="' + accent + '" opacity="0"/>';
    host.style.position = 'relative';
    host.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + (o.label || 'chart') + '">' + s + '</svg><div class="tip"></div>');
    var svg = host.querySelector('svg'), tip = host.querySelector('.tip'), cx = svg.querySelector('#cx'), cd = svg.querySelector('#cd');
    svg.addEventListener('mousemove', function (e) {
      var r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W, t = t0 + (px - L) / (W - L - R) * (t1 - t0), best = 0;
      for (var i = 1; i < ts.length; i++) if (Math.abs(ts[i] - t) < Math.abs(ts[best] - t)) best = i;
      var X = x(ts[best]), Y = y(vs[best]);
      cx.setAttribute('x1', X); cx.setAttribute('x2', X); cx.setAttribute('opacity', .5); cd.setAttribute('cx', X); cd.setAttribute('cy', Y); cd.setAttribute('opacity', 1);
      tip.textContent = (o.tipLabel || '') + fmt(vs[best], kind) + ' · ' + day(ts[best]); tip.style.display = 'block';
      tip.style.left = Math.min(Math.max(X / W * r.width, 70), r.width - 70) + 'px'; tip.style.top = (Y / H * r.height) + 'px';
    });
    svg.addEventListener('mouseleave', function () { tip.style.display = 'none'; cx.setAttribute('opacity', 0); cd.setAttribute('opacity', 0); });
  }
  return { line: line, fmt: fmt };
})();
</script>
