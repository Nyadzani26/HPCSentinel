<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HPCSentinel{% endblock %}</title>
  <style>
    :root { --ink:#1d2733; --muted:#5b6776; --line:#d9dee5; --bg:#f6f7f9; --card:#fff; --nav:#1d2733;
            --normal:#2e7d4f; --unusual:#b3261e; --review:#b26a00; --unknown:#6b7480; --accent:#1f5fbf; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; color: var(--ink); background: var(--bg); line-height: 1.45; }
    header { background: var(--nav); color: #fff; padding: .65rem 1.25rem; display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
    header a { color: #fff; text-decoration: none; padding: .2rem .1rem; border-bottom: 2px solid transparent; }
    header a:hover, header a.on { border-bottom-color: #fff; }
    header .right { margin-left: auto; display: flex; gap: .75rem; align-items: center; font-size: .9rem; }
    main { max-width: 74rem; margin: 1.5rem auto; padding: 0 1.25rem; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; } h2 { font-size: 1.1rem; margin: 1.5rem 0 .6rem; }
    .stack > * + * { margin-top: .9rem; }
    label { display: block; font-size: .9rem; }
    input, select, textarea { display: block; margin-top: .25rem; padding: .4rem; width: 18rem; max-width: 100%; font: inherit; }
    textarea { width: 30rem; }
    button, .btn { padding: .45rem .95rem; font: inherit; background: var(--accent); color: #fff; border: 0; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
    button.secondary { background: #e7ebf0; color: var(--ink); }
    header button { background: #3a4757; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 1rem 1.15rem; }
    .error { color: var(--unusual); } .muted { color: var(--muted); font-size: .9rem; }
    .msg { padding: .6rem .9rem; border-radius: 4px; margin-bottom: .8rem; background: #e6f2ea; border: 1px solid #b8d9c3; }
    .msg.error { background: #fbe9e7; border-color: #efb9b3; color: var(--unusual); }
    table { border-collapse: collapse; width: 100%; background: var(--card); font-size: .92rem; }
    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: #eef1f5; font-weight: 600; }
    .pill { display: inline-block; padding: .05rem .55rem; border-radius: 999px; font-size: .8rem; color: #fff; background: var(--unknown); }
    .pill.normal { background: var(--normal); } .pill.unusual, .pill.OPEN { background: var(--unusual); }
    .pill.review, .pill.ACKNOWLEDGED { background: var(--review); } .pill.CLOSED { background: var(--unknown); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: .6rem; }
    .tile { display: block; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--unknown); border-radius: 5px; padding: .55rem .65rem; }
    .tile.normal { border-left-color: var(--normal); } .tile.unusual { border-left-color: var(--unusual); background: #fdf3f2; }
    .tile.review { border-left-color: var(--review); background: #fdf7ec; } .tile.unknown { border-left-color: var(--unknown); background: #f1f2f4; }
    .tile b { display: block; } .tile small { color: var(--muted); }
    .summary { display: flex; gap: .8rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .summary .card { min-width: 8rem; } .summary strong { font-size: 1.5rem; display: block; }
    .banner { padding: .7rem 1rem; border-radius: 5px; margin-bottom: 1rem; background: #fdf0d5; border: 1px solid #ecc97a; }
    .row { display: flex; gap: 2rem; flex-wrap: wrap; } .row > * { flex: 1 1 22rem; }
    .inline { display: inline; }
  </style>
</head>
<body>
  <header>
    <strong>HPCSentinel</strong>
    {% if user.is_authenticated %}
    <nav style="display:flex;gap:1.1rem">
      <a href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' or request.resolver_match.url_name == 'node_detail' %}class="on"{% endif %}>Fleet</a>
      <a href="{% url 'alert_list' %}" {% if 'alert' in request.resolver_match.url_name %}class="on"{% endif %}>Alerts</a>
      {% if user.is_administrator %}<a href="{% url 'users' %}" {% if request.resolver_match.url_name == 'users' %}class="on"{% endif %}>Users</a>
      <a href="{% url 'controls' %}" {% if request.resolver_match.url_name == 'controls' %}class="on"{% endif %}>Controls</a>{% endif %}
    </nav>
    <span class="right">{{ user.username }} ({{ user.get_role_display }})
      <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button type="submit">Sign out</button></form>
    </span>
    {% endif %}
  </header>
  <main>
    {% for m in messages %}<div class="msg {{ m.tags }}" role="status">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
