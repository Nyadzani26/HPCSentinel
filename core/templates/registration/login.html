{% extends "base.html" %}
{% block title %}Sign in · HPCSentinel{% endblock %}
{% block anon %}
<h1 style="margin-bottom:.3rem">HPCSentinel</h1>
<p class="muted" style="margin-bottom:1.4rem">Sign in to see which nodes need attention.</p>
<form method="post" class="card form">
  {% csrf_token %}
  {% if form.errors %}<p class="error" role="alert">The username or password is not correct.</p>{% endif %}
  <label for="id_username">Username{{ form.username }}</label>
  <label for="id_password">Password{{ form.password }}</label>
  <button type="submit" class="btn">Sign in</button>
</form>
{% endblock %}
